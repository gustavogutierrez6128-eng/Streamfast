<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamFast - Registro</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    body { background: #080a0f; color: #f0f2f7; font-family: 'DM Sans', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .form-card { background: #0e1117; padding: 40px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.07); width: 100%; max-width: 400px; box-shadow: 0 12px 24px rgba(0,0,0,0.5); }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 3rem; text-align: center; margin-bottom: 20px; background: linear-gradient(45deg, #e63946, #ff6b35); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    h2 { text-align: center; margin-bottom: 20px; font-weight: 500; font-size: 1.5rem; }
    input { width: 100%; padding: 12px; margin-bottom: 15px; background: #1a1f2e; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: #fff; font-size: 1rem; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #e63946; border: none; border-radius: 6px; color: white; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button:hover { background: #ff6b35; }
    p { text-align: center; font-size: 0.9rem; color: #6b7280; margin-top: 20px; }
    a { color: #e63946; text-decoration: none; }
  </style>
</head>
<body>
  <div class="form-card">
    <div class="logo">STREAMFAST</div>
    <h2>Crear Cuenta</h2>
    <form id="registroForm">
      <input type="text" id="nombre" placeholder="Nombre completo" required>
      <input type="email" id="email" placeholder="Correo electrónico" required>
      <input type="password" id="password" placeholder="Contraseña" required>
      <button type="submit">Registrarse</button>
    </form>
    <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
  </div>

  <script>
    document.getElementById('registroForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nombre = document.getElementById('nombre').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const respuesta = await fetch('/api/registro', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre, email, password })
        });
        const datos = await respuesta.json();
        
        if (respuesta.ok) {
          alert('¡Registro exitoso! Ahora inicia sesión.');
          window.location.href = 'login.html';
        } else {
          alert(datos.error);
        }
      } catch (error) {
        alert('Error al conectar con el servidor.');
      }
    });
  </script>
</body>
</html>
