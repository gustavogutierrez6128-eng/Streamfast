<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamFast - Registro</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    body { background: #080a0f; color: #f0f2f7; font-family: 'DM Sans', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .form-card { background: #0e1117; padding: 40px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.07); width: 100%; max-width: 400px; box-shadow: 0 12px 24px rgba(0,0,0,0.5); }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 3rem; text-align: center; margin-bottom: 20px; background: linear-gradient(45deg, #e63946, #ff6b35); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; }
    h2 { text-align: center; font-size: 1.5rem; margin-bottom: 30px; font-weight: 500; color: #9ca3af; }
    form { display: flex; flex-direction: column; gap: 20px; }
    input { background: #1f2937; border: 1px solid rgba(255,255,255,0.1); padding: 14px 16px; border-radius: 8px; color: #fff; font-size: 1rem; transition: all 0.3s; }
    input:focus { outline: none; border-color: #e63946; box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.2); }
    button { background: linear-gradient(45deg, #e63946, #ff6b35); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: all 0.3s; margin-top: 10px; box-shadow: 0 4px 12px rgba(230, 57, 70, 0.3); }
    button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(230, 57, 70, 0.5); }
    p { text-align: center; font-size: 0.9rem; color: #6b7280; margin-top: 20px; }
    a { color: #e63946; text-decoration: none; }
  </style>
</head>
<body>
  <div class="form-card">
    <div class="logo">STREAMFAST</div>
    <h2>Crear Cuenta</h2>
    <form id="registerForm">
      <input type="text" id="nombre" placeholder="Nombre completo" required>
      <input type="email" id="email" placeholder="Correo electrónico" required>
      <input type="password" id="password" placeholder="Contraseña" required>
      <button type="submit">Registrarse</button>
    </form>
    <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nombreVal = document.getElementById('nombre').value;
      const emailVal = document.getElementById('email').value;
      const passwordVal = document.getElementById('password').value;

      try {
        const respuesta = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre: nombreVal, correo: emailVal, password: passwordVal })
        });
        
        const datos = await respuesta.json();
        
        if (respuesta.ok) {
          alert('¡Registro exitoso! Ahora puedes iniciar sesión.');
          window.location.href = 'login.html';
        } else {
          alert(datos.error || 'Hubo un error al registrar el usuario.');
        }
      } catch (error) {
        console.error(error);
        alert('Error al conectar con el servidor.');
      }
    });
  </script>
</body>
</html>
